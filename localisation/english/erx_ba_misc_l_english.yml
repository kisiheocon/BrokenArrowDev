LOADING_TIP_127: "We are not interested in the possibilities of defeat; they do not exist.\n - §YQueen Victoria, December 1899§!"
LOADING_TIP_128: "The task will be hard. There may be dark days ahead... but we can only do the right as we see the right, and reverently commit our cause to God.\n - §YKing George VI, September 3rd, 1939§!"
LOADING_TIP_129: "Dear father, I go now to fulfill my mission and my destiny. I hope it is a destiny that brings honor to our family and if it requires my life, I will sacrifice it gladly to be a good servant of our nation.\n - §YIsao Matsuo - 1944§!"
LOADING_TIP_130: "How pitiable is it to reflect, that you should at the same time counteract his mercies, in detaining by fraud and violence so numerous a part of my brethren under groaning captivity and cruel oppression.\n - §YBenjamin Banneker - August 19th 1791§!"
LOADING_TIP_131: "The price of progress is steep. It remains to be seen if it is insurmountable.\n - §YDouglas Granite - 2275§!"
LOADING_TIP_132: "We should be free, or die in the attempt. There can be no greater objective, there can be no greater sacrifice.\n - §YDouglas Granite - 2275§!"
LOADING_TIP_133: "The civil rights of a people being of the greatest value, it shall ever be our duty to vindicate our brethren.\n - §YFreedom's Journal, March 16, 1827§!"
LOADING_TIP_134: "By Freedom gained, by Truth maintained, Thine Empire shall be strong!\n - §YA. C. Benson 1902§!"
LOADING_TIP_135: "Wider still and wider shall thy bounds be set; God, who made thee mighty, Make thee mightier yet!\n - §YA. C. Benson 1902§!"
LOADING_TIP_136: "Hark, a mighty nation maketh glad reply.\n - §YA. C. Benson 1902§!"
LOADING_TIP_137: "The Constitution itself, plainly written as it is, the safeguard of our federative compact.\n - §YJames K. Polk 1845§!"
LOADING_TIP_138: "It was patriotism, not communism, that inspired me.\n - §YPresident Ho Chi Minh 1960§!"
LOADING_TIP_139: "Nothing is more precious than independence and liberty.\n - §YPresident Ho Chi Minh 1966§!"
LOADING_TIP_140: "The final outcome of a war is often determined by the degree of initiative shown on each side.\n - §YGeneralissimo Chiang Kai-shek 1939§!"
LOADING_TIP_141: "Patriotism demands of us sustained sacrifice.\n - §YGeneralissimo Chiang Kai-shek July 1937§!"
LOADING_TIP_142: "There are only two things we should fight for. One is the defense of our homes and the other is the Bill of Rights.\n - §YSmedley Butler§!"
LOADING_TIP_143: "To get the best out of your men, they must feel that you are their real leader and must know that they can depend upon you.\n - §YJohn Pershing§!"
LOADING_TIP_144: "In the face of adversity, true character is revealed, and it is in those moments that we find our true strength.\n - §YRobert Gould Shaw§!"
LOADING_TIP_145: "When a thing is done, it's done. Don't look back. Look forward to your next objective.\n - §YGeorge G Marshall§!"
LOADING_TIP_146: "I am quite certain that the crimes of this guilty land will never be purged away but with blood. I had, as I now think vainly, flattered myself that without very much bloodshed it might be done.\n - §YJohn Brown§!"
LOADING_TIP_147: "Brave rifles! Veterans! You have been baptized in fire and blood and have come out steel!\n - §YWinfield Scott§!"
LOADING_TIP_148: "After the war, they took Army dogs and rehabilitated them for civilian life. But they turned soldiers into civilians immediately, and let em sink or swim.\n - §YAudie Murphy§!"
LOADING_TIP_149: "Now more than ever the people are responsible for the character of their Congress. If that body be ignorant, reckless, and corrupt, it is because the people tolerate ignorance, recklessness, and corruption.\n - §YJames Garfield§!"
LOADING_TIP_150: "Now more than ever, the people are responsible for the character of their Congress. If that body be ignorant, reckless, and corrupt, it is because the people tolerate ignorance, recklessness, and corruption.\n - §YPresident James A. Garfield July 4th, 1876§!"
LOADING_TIP_151: "Truth and right and freedom, each a holy gem.\n - §YA. C. Benson 1902§!"
LOADING_TIP_152: "Throned amid the billows, throned inviolate.\n - §YA. C. Benson 1902§!"
LOADING_TIP_153: "There's another country, I heard of long ago.\n - §YSir Cecil Spring Rice, 1921§!"
LOADING_TIP_154: "In days of yore, from Britain's shore, Wolfe the dauntless hero, came, and planted firm, Britannia's flag on Canada's fair domain.\n - §YAlexander Muir, 1867§!"
LOADING_TIP_155: "The thistle, shamrock, rose entwine, the Maple Leaf forever.\n - §YAlexander Muir, 1867§!"
LOADING_TIP_156: "The Maple Leaf, our emblem dear, The Maple Leaf forever!\n - §YAlexander Muir, 1867§!"
LOADING_TIP_157: "Glory, glory, hallelujah!\n - §YJulia Ward Howe, November 1861§!"
LOADING_TIP_158: "As he died to make men holy, let us live to make men free!\n - §YJulia Ward Howe, November 1861 §!"
LOADING_TIP_159: "Down with the traitors, up with the stars!\n - §YGeorge Frederick Root, 1862§!"
LOADING_TIP_160: "America, America, God shed his grace on thee!\n - §YKatharine Lee Bates, 1893§!"
LOADING_TIP_161: "Who more then self, their country loved, and mercy more than life!\n - §YKatharine Lee Bates, 1893§!"
LOADING_TIP_162: "From the mountains, to the prairies, to the oceans white with foam!\n - §YIrving Berlin, 1918§!"
LOADING_TIP_163: "Now I'm a widow. Ah! That mournful word. Little does the world think of the agony it contains!\n - §YSally Randle Perry, 1862§!"
LOADING_TIP_164: "The will of God prevails. In great contests each party claims to act in accordance with the will of God. Both may be, and one must be, wrong.\n - §YPresident Abraham Lincoln, September 2nd, 1862§!"
LOADING_TIP_165: "The Nation asks for action - and action now.\n - §YPresident Franklin Delano Roosevelt, March 4th, 1933§!"
LOADING_TIP_166: "The task that we Americans now face will test us to the uttermost. Never before have we been called upon for such a prodigious effort. Never before have we had so little time in which to do so much.\n - §YPresident Franklin Delano Roosevelt, February 23, 1942§!"
LOADING_TIP_167: "The only limit to our realization of tomorrow will be our doubts of today. Let us move forward with strong and active faith.\n - §YPresident Franklin Delano Roosevelt, April 12th, 1945§!"
LOADING_TIP_168: "Everyone knows the grass isn't greener on the other side of the hill, despite how much we may desire it to be. But maybe... just maybe... this time it is.\n - §YUnknown Traveler§!"
LOADING_TIP_169: "The public interest may be presumed to be what men would choose if they saw clearly, thought rationally, and acted distenterestedly and benevolently.\n - §YLippmann, 1955§!"
LOADING_TIP_170: "The weightier debates of constitutional principle are even yet by no means concluded; but they are no longer of more immediate practical moment than questions of administration. It is getting to be harder to run a constitution than to frame one.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_171: "There is scarcely a single duty of government which was once simple which is not now complex; government once had but a few masters; it now has scores of masters.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_172: "Where government once might follow the whims of a court, it must now follow the views of a nation.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_173: "If we would employ it, we must Americanize it, and that not formally, in language merely, but radically, in thought, principle, and aim as well. It must learn our constitutions by heart; must get the bureaucratic fever out of its veins; must inhale much free American air.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_174: "Like a lusty child, government with us has expanded in nature and grown great in stature, but has also become awkward in movement.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_175: "For wherever public opinion exists it must rule.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_176: "Whoever would effect a change in a modern constitutional government must first educate his fellow-citizens to want some change. That done, he must persuade them to want the particular change he wants.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_177: "We do not study the art of governing: we govern.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_178: "Monarchies and democracies, radically different as they are in other respects, have in reality much the same business to look to.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_179: "So long as we know only ourselves, we know nothing.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_180: "He may serve his king; I will continue to serve the people.\n - §YPresident Woodrow Wilson, 1887§!"
LOADING_TIP_181: "Every day a triumph, every day a victory. For our continued existence, be It grand or mundane ensures the survival of American Civilization.\n - §YDouglas Granite, 2278§!"
LOADING_TIP_182: "Public value failure occurs when neither the market nor public sector actions provide the values required for the collective well-being of society.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_183: "When we privatize public services, we are not just changing the provider; we are fundamentally altering the moral and ethical accountability owed to the citizen.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_184: "Economic efficiency is a value, but it is not the only public value. A society that prioritizes only cost-cutting will eventually find itself morally bankrupt.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_185: "The unique mission of public administration is to safeguard the collective interests that the competitive marketplace willfully ignores.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_186: "The core problem with economic individualism is that it treats the citizen merely as a consumer, converting public duties into simple transaction fees.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_187: "Market indicators excel at tracking wealth, but they are fundamentally blind to equity, justice, and the distribution of collective human dignity.\n - §YBarry Bozeman, 2007§!"
LOADING_TIP_188: "Administrative evil poses a fundamental challenge to the ethical foundations of public administration... where modern organization masks acts of dehumanization and destruction in the norm of public interest.\n - §YAdams and Balfour, 2004§!"
LOADING_TIP_189: "Ethics cannot be reduced to a purely technical or legal framework; a fixation on compliance over substance allows technical efficiency to eclipse human morality.\n - §YAdams and Balfour, 2004§!"

